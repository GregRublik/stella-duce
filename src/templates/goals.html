{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="static/css/styles.css">
<link rel="stylesheet" href="static/css/navbar.css">
<link rel="stylesheet" href="static/css/goals.css">
{% endblock %}

{% block body %}
{% include "navbar.html" %}
<div class="goals-page">
    <!-- Левая колонка: список целей -->
    <div class="goals-list-section">
        <h2>My Goals</h2>
        <button class="btn-create" onclick="createNewGoal()">+ New Goal</button>
        <div id="goals-list"></div>
    </div>

    <!-- Правая колонка: редактор цели -->
    <div class="goal-editor-section">
        <h2>Edit Goal</h2>
        <input type="text" id="edit-title" placeholder="Goal title">
        <textarea id="edit-description" placeholder="Goal description (optional)"></textarea>
        <div class="editor-buttons">
            <button onclick="saveGoal()">Save Changes</button>
            <button class="btn-secondary" onclick="deleteGoal()">Delete</button>
            <button class="btn-stages" onclick="openStages()">Open Stages</button>
        </div>
    </div>
</div>

<script src="static/js/api.js"></script> <!-- Здесь должна быть функция request() -->
<script src="static/js/goals.js"></script>
{% endblock %}
