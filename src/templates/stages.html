{% extends "base.html" %}
{% block head %}
<link rel="stylesheet" href="static/css/stages.css">
<link rel="stylesheet" href="static/css/navbar.css">
{% endblock %}

{% block body %}
{% include "navbar.html" %}

<div id="container">
    <div id="stage-editor" class="stage-editor hidden">
        <h3>Редактировать стадию</h3>
        <label>Название: <input type="text" id="stage-title"></label>
        <label>Описание: <textarea id="stage-description"></textarea></label>
        <label>Статус:
            <select id="stage-status">
                <option value="NOT_STARTED">Не начата</option>
                <option value="IN_PROGRESS">В работе</option>
                <option value="COMPLETED">Завершена</option>
                <option value="SKIPPED">Пропущена</option>
            </select>
        </label>
        <label>Milestone: <input type="checkbox" id="stage-milestone"></label>
        <label>Сложность: <input type="number" id="stage-difficulty" min="1" max="5"></label>
        <button onclick="saveStageChanges()">Сохранить</button>
        <hr>
        <button onclick="createNewStage()">➕ Добавить новую стадию</button>
    </div>

    <div id="canvas"></div>
</div>

<script src="static/js/api.js"></script>
<script src="static/js/stages.js"></script>
{% endblock %}
